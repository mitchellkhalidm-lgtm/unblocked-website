<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        :root {
            --bg: #0b0b12;
            --panel: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.12);
            --text: #f5f7ff;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1a1f2e 0%, var(--bg) 45%, #05070d 100%);
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 14px;
        }

        .menu {
            width: min(900px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
            padding: 36px 32px 28px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .subtitle {
            margin: 0 0 20px;
            text-align: center;
            color: rgba(255,255,255,0.72);
        }

        .game-list {
            display: grid;
            gap: 14px;
        }

        .game-link {
            display: block;
            padding: 18px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255,93,93,0.15), rgba(125,211,252,0.10));
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .game-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(125,211,252,0.10);
        }

        .game-link:focus-visible {
            outline: 3px solid #7dd3fc;
            outline-offset: 3px;
        }

        .version {
            margin-top: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .menu {
                padding: 28px 20px 22px;
            }

            .game-link {
                padding: 16px;
                font-size: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="menu">
        <h1>Games</h1>
        <p class="subtitle">Choose a game</p>
        <div class="game-list">
            <a class="game-link" href="math-quest/1/index.html">Math Quest</a>
            <a class="game-link" href="ela/2/index.html">Science Lab</a>
            <a class="game-link" href="social%20studies/ucn/index.html">History Challenge</a>
            <a class="game-link" href="art/GitterCheese-Slope-f70c7c8/index.html">Geometry Sprint</a>
            <a class="game-link" href="math/ozh-cookieclicker-c77f00c/index.html">Word Power</a>
        </div>
    </div>
    <footer class="version">Version 1</footer>
</body>
</html>
